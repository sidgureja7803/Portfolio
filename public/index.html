    <script>
      // Runs before first paint to avoid a light-mode flash: applies the saved
      // theme, or 'dark' as the site default, ahead of React hydration.
      (function () {
        try {
          var validThemes = ['light', 'dark', 'ocean', 'sunset', 'forest'];
          var saved = localStorage.getItem('theme');
          var theme = validThemes.indexOf(saved) !== -1 ? saved : 'dark';
          document.documentElement.classList.add(theme);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
